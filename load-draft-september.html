            value: '"아무 것도 염려하지 말고 다만 모든 일에 ㄱ도와 간구로, 너희 구할 것을 감사함으로 ㅎ나님께 아뢰라" (빌 4:6)\n\n싸바이디~!\nㅈ님의 이름으로 문안드립니다. 찜통 같던 8월이 훌쩍 지나가고, 어느새 9월의 바람이 불어옵니다. 저희 가정은 낯선 라0스 땅에서 매일 크고 작은 좌충우돌을 겪으며 하루하루를 은혜로 채워가고 있습니다.\n\n**언어의 장벽, 시장 나들이...**\n8월 10일부터는 로뎀학원에 등록해서 본격적으로 언어 훈련에 뛰어들었습니다. 집에 돌아와서도 라0스어 과외를 계속 받으며 어떻게든 입을 떼보려고 안간힘을 쓰고 있습니다. 하지만 막상 현지인들 앞에 서면 머릿속이 하얘지고 꿀 먹은 벙어리가 되곤 합니다. 언어의 장벽이 생각보다 높고 견고해서 가끔은 좌절감도 밀려옵니다. \n\n며칠 전 두 아이의 손을 잡고 동네 현지 시장에 나갔을 때, 위축된 제 입술을 열어주시는 작은 은혜를 경험했습니다. 시장 상인들에게 배운 대로 더듬더듬 인사를 건네고, 찹쌀밥과 간식을 샀을 때 환하게 웃어주던 그들의 미소가 잊히지 않습니다. 특별히 요한이에게 시장에서 제일 먹고 싶은 게 뭐냐고 물었더니, 주저 없이 \'신라면!\'이라고 외쳐서 온 가족이 한바탕 크게 웃었습니다. 타지 생활의 팍팍함 속에서도 이런 소소한 웃음이 저희를 살게 합니다.\n\n시장을 다녀오며 "무엇을 먹을까 마실까 염려하지 말라"는 말씀이 떠올랐습니다. 저희의 서툰 언어에도 마음을 열어주는 이들을 보며, ㅎ나님께서 이 땅의 영혼들을 품으라고 저희를 부르셨음을 다시금 묵상하게 되었습니다.\n\n**낯선 학교생활을 시작한 아이들...**\n14일에는 노아와 요한이의 글로리스쿨 오리엔테이션이 있었습니다. 학교 준비물을 개학을 코앞에 둔 전날에서야 덜컥 알려주는 바람에, 온 동네를 뛰어다니며 부랴부랴 짐을 챙기느라 진땀을 뺐습니다. 우여곡절 끝에 19일 개학을 맞이했지만, 막상 학교에 간 아이들을 보니 짠한 마음을 감출 수가 없었습니다. 노아가 아직 선생님 말씀을 전혀 알아듣지 못해서, 옆에 앉은 친구들이 자리에서 일어나면 같이 일어나고, 책을 펴면 눈치껏 따라 펴는 식입니다.\n\n말도 안 통하는 교실에 덩그러니 앉아있을 아이들을 생각하면 부모로서 미안함이 앞섭니다. 그래도 투정 한 번 부리지 않고 아침마다 씩씩하게 가방을 메고 나서는 두 아들이 그저 고맙고 대견할 따름입니다. 낯선 환경과 문화 속에서도 우리 아이들이 기죽지 않고, 오히려 이 시간을 통해 믿음의 그릇이 훌쩍 커지기를 간절히 바라고 있습니다.\n\n**마음을 모아 부르짖는 시간...**\n28일에는 라선협 ㄱ도회에 다녀왔습니다. 같은 부르심을 받은 동역자들이 한자리에 모여, 은혜 가운데 뜨겁게 눈물 흘리며 통성으로 ㄱ도했습니다. 다음 날인 29일에 이어진 ㅅㄱ부 모임에서도 라0스를 향한 애통한 마음을 나누며 ㄱ도의 단을 쌓았습니다. 홀로 떨어져 있는 것 같아 외로울 때도 있었지만, 이렇게 같은 곳을 바라보는 동역자들이 곁에 있다는 사실 하나만으로도 얼마나 큰 위로와 힘이 되는지 모릅니다.\n\n요즘 저희는 현지 사역과 원활한 이동을 위해 차량 모금을 진행하고 있습니다. 교통수단이 여의치 않은 이곳에서 발이 되어줄 차량이 꼭 필요합니다. 모금이 순조롭게 채워져서, 이 땅 구석구석을 누비며 복음을 전할 수 있도록 두 손 모아 주시기를 부탁드립니다.\n\n멀리서도 잊지 않고 늘 무릎으로 동역해 주시는 여러분 덕분에 저희 가정이 버티고 있습니다. 정말 감사합니다. 언제나 평안하시기를 ㅈ님의 이름으로 ㄱ도합니다.\n\n라0스에서 박0진, 김0정 드림'
