        "type": "text",
        "value": "\"그러므로 너희는 O나님이 택하사 거룩하고 사랑 받는 자처럼 긍휼과 자비와 겸손과 온유와 오래 참음을 옷 입고 누가 누구에게 불만이 있거든 서로 용납하여 피차 용서하되 ㅈ께서 너희를 용서하신 것 같이 너희도 그리하고 이 모든 것 위에 사랑을 더하라 이는 온전하게 매는 띠니라\" (골3:12~14)\n\n싸바이디~! \n사랑하는 동역자 여러분께 ㅈ님의 이름으로 문안을 드립니다. 길었던 우기가 물러가고, 새벽에는 조금 선선한 바람이 불어오지만 한낮에는 여전히 뜨거운 태양이 내리쬐는 건기의 문턱에 섰습니다. 타국에서의 하루하루는 낯섦과 배움의 연속입니다. 부족한 저희의 발걸음을 변함없이 붙들어 주시는 ㅈ님의 은혜, 그리고 함께 손 모아 주시는 동역자님들의 사랑을 기억하며 지난 한 달간의 소식을 전해드립니다.\n\n**[c:#1565c0|바뀐 교복과 '버뺀냥' - 사람을 향한 마음의 씨름]**\n라O스는 유치원 꼬마들부터 대학생까지 모든 학생이 교복을 입습니다. 저희 부부가 다니는 국립대 언어과정 '삐까암'도 예외는 아닙니다. 흰색 셔츠에 검은색 바지를 입고, 가슴에는 학교 로고를 오바로크(자수)로 새겨야 합니다. 현지에서는 체형에 맞는 큰 사이즈를 구하기가 쉽지 않아, 출국 전 한국 쿠팡에서 1만 원짜리 저렴한 셔츠를 미리 사 왔습니다.\n\n학교 로고를 새기기 위해 캠퍼스 안 수선점에 셔츠 두 벌을 맡겼습니다. 며칠 뒤 옷을 찾으러 갔는데 엉뚱한 일이 벌어졌습니다. 두 벌 중 하나가 브랜드도 완전히 다르고, 겨우 어깨 한쪽이나 들어갈 법한 아주 작은 옷이었습니다. 분명 다른 사람의 옷과 바뀐 것이었습니다.\n\n\"제가 맡긴 옷이 아닙니다. 제 옷을 찾아주세요.\"\n정중하게 말씀드렸지만, 돌아온 수선점 주인의 태도는 당황스러웠습니다. 미안하다는 말 한마디 없이, 도리어 큰 소리로 성을 내며 우겼습니다.\n\"당신이 맡긴 옷이 맞아! 우린 잘못한 게 없어. 옷을 잘못 가져온 당신들 탓이야!\"\n\n옷값을 물어내야 할까 봐 미리 큰 소리를 치며 방어막을 치는 눈치였습니다. 1만 원짜리 저렴한 옷이라 값이 아까운 게 아니었습니다. 현지에서 제 몸에 맞는 사이즈를 다시 구할 수 없다는 사실이 답답했습니다. 진짜 주인이 찾아올지도 모르니 바뀐 작은 옷은 그대로 두고, 연락처를 남긴 채 돌아섰습니다. 끝내 제 옷은 찾지 못했습니다.\n\n라O스에는 잘못을 해도 사과하지 않는 독특한 문화가 있습니다. 이 땅의 사람들은 '체면(Face)'을 잃는 것을 수치로 여깁니다. 잘못을 인정하는 순간 체면이 깎이고 책임을 져야 한다는 두려움이 큽니다. 불교적 인연 사상과 맞물려 갈등 자체를 피하려는 성향도 강합니다. 무슨 일이 생기든 \"버뺀냥(괜찮아, 문제없어)\" 한마디로 상황을 덮고 넘어가는 것이 조화를 지키는 길이라 믿습니다.\n\n지난 4개월간 정착하며 이런 일을 숱하게 겪었습니다. 입주하자마자 에어컨에 곰팡이가 가득해 청소 업체를 불렀더니 에어컨을 고장을 내놓고도 버뺀냥, 겨우 고친 워터 펌프가 며칠 만에 또 고장 나도 버뺀냥, 식당에서 주문과 전혀 다른 음식이 나와도 버뺀냥, 약속 시간보다 몇 시간을 늦게 와도 버뺀냥, 온 동네가 떠나가라 새벽 내내 음악을 틀어 밤잠을 설치게 해놓고도 버뺀냥...\n\n속으로 꾹꾹 눌러 담아왔던 서운함이 이번 옷 사건으로 터져 나왔습니다. 뻔뻔하게 소리를 지르며 저희 탓을 하는 주인의 얼굴을 보는데, 마음 밑바닥에서 사람에 대한 미운 감정이 불쑥 솟구쳤습니다."

        "value": "**[c:#1565c0|사도 바울의 발자취 앞에서 - 억울함 너머의 사랑]**\n집으로 돌아오는 길, 마음이 몹시 무거웠습니다. ㅂ음을 전하다가 매를 맞거나 감옥에 갇힌 것도 아닌데, 고작 1만 원짜리 셔츠 한 벌 잃어버렸다고 사람을 미워하고 분박하고 있는 제 자신이 부끄러웠습니다.\n\n문득 빌립보 감옥에 갇혔던 사도 바울이 떠올랐습니다. 억울하게 옷을 찢기고 매를 수없이 맞은 채 깊은 옥에 갇혀 착고에 묶였으면서도, 밤중에 O나님을 찬미하고 자신을 가둔 간수의 ㄱ원을 위해 눈물 흘렸던 바울의 모습이 오버랩되었습니다. 온갖 모욕과 억울함 속에서도 \"우리가 사방으로 우겨쌈을 당하여도 싸이지 아니한다\"고 고백했던 그의 사랑은 어디서 온 것이었을까요.\n\n'앞으로 ㅂ음을 전하다가 더 큰 억울함과 모욕을 당할 때도 나는 과연 이럴 것인가?'\n제 안의 옹졸한 그릇을 발견하며 무릎을 꿇었습니다. 이 땅을 섬기러 왔노라 하면서도 작은 손해조차 견디지 못하는 연약함을 회개했습니다. 사람의 힘으로는 사랑할 수 없습니다. ㅈ님께서 제게 주셨던 끝없는 용서와 자비를 기억하며, 이 땅의 사람들을 진심으로 품고 불쌍히 여길 수 있는 마음을 부어주시길 간절히 ㄱ도했습니다.\n\n**[c:#1565c0|삐까암 교실의 다국적 조와 보이지 않는 동역자]**\n10월 12일부터 본격적인 삐까암 수업이 시작되었습니다. 교실에 들어가 보니 학생 구성이 참 묘합니다. 중국인 학생이 90%, 베트남 학생이 5%, 한국인 학생이 5%입니다. 전 세계에 남아있는 공산주의 국가는 중국, 베트남, 라O스, 북한, 쿠바 등 5개국뿐입니다. 그중 3개국의 청년들이 한 교실에 모여 앉아 함께 라O스어를 배우고 있습니다. 공산권 국가의 중심에 들어와 공부하고 있다는 사실이 실감 나며 묘한 긴장감마저 듭니다.\n\n대학 과정이지만 한국의 학창 시절처럼 요일별로 당번 조를 정해 운영합니다. 교실 청소와 뒷정리, 선생님의 수업 준비를 돕는 일입니다. 저희 부부 둘과 중국인 친구 2명, 베트남 친구 1명이 한 조가 되어 수요일을 책임지는 다국적 당번 조가 꾸려졌습니다.\n\n함께 어울려 청소하고 이야기를 나누다 뜻밖의 사실을 알게 되었습니다. 반에서 만난 중국인 친구들 중 두 명이 O나님의 사람(선생님)이었습니다. 15년 전 라O스에서 1년간 단기 시절을 보낼 때도 중국의 지하 가정ㄱ회에서 파송된 중국인 사역자들과 교제한 적이 있었는데, 이번에 만난 두 청년도 동일하게 가정ㄱ회에서 파송을 받아 온 친구들이었습니다.\n\n라O스에 유학을 오는 중국 학생들이 워낙 많다 보니, 이들을 감시하고 관리하기 위해 학생들 틈에 비밀 공안들이 위장해 들어와 있다는 소문이 파다합니다. 두 친구는 신분이 노출될까 봐 이야기를 나눌 때마다 늘 주변 눈치를 살피며 조심스러워합니다. 비록 교실 안에서 속 깊은 신앙 이야기를 마음껏 나눌 수는 없지만, 복도에서 마주칠 때마다 눈빛으로 서로를 응원하며 마음으로 중보합니다.\n\n헤어질 때면 라O스어 크리스천 인사말인 \"프라짜오웨이폰(O나님의 복이 함께하길)\"을 가만히 건넵니다. 삼엄한 공산주의의 그늘 속에서도, 보이지 않는 곳에서 쉬지 않고 역사하시는 O나님의 살아계심을 체감하는 순간입니다."

        "value": "**[c:#1565c0|순수한 성탄의 기다림, 그리고 억판사 명절]**\n10월 중순, 수업을 마치고 학교 앞 작은 식당에 들렀다가 반가운 인연을 만났습니다. 로뎀어학원에서 라O스어를 가르쳐주셨던 뚝따 선생님이었습니다. 반가운 인사를 나누며 현지 크리스천들의 소식을 전해 들었는데, 마음에 큰 울림이 있었습니다.\n\n현지 성ㄷ님들은 벌써 10월부터 다가올 성탄절을 준비하며 스킷드라마 연습을 시작했다고 합니다. 1년에 단 하루, ㅇ수님의 오심을 축하하기 위해 두 달도 전부터 모여 땀 흘리며 연습한다는 소식을 들으며 마음이 뭉클했습니다. 언제부턴가 의례적인 행사로 흘러가기 쉬운 한국 ㄱ회의 성탄절 모습과 스스로의 마음을 돌아보게 되었습니다. ㅈ님을 향한 첫사랑과 순수한 열정이 무엇인지 현지인들을 통해 다시 배웁니다.\n\n10월 26일과 27일은 라O스의 큰 명절인 분억판사(ບຸນອອກພັນສາ)였습니다. 우기 동안 승려들이 사원에 머물며 수행하던 3개월의 우안거가 끝나는 것을 축하하는 날입니다. 대부분의 학교와 관공서가 휴일이었지만 저희 삐까암 과정은 정상 수업을 진행했습니다. 등굣길 거리마다 곱게 단장하고 사원으로 향하는 수많은 현지인들의 행렬을 보았습니다. 화려한 등불과 제물 뒤에 가려진 영적 어둠과 공허함이 눈에 밟혀, 이 땅에 참된 진리의 빛이 비추어지기를 걸음을 옮기며 속으로 간절히 구했습니다.\n\n**[c:#1565c0|단전의 어둠을 밝힌 감사와 까마귀의 공급]**\n라O스는 각 가정마다 설치된 물탱크에서 모터펌프로 물을 끌어올려 사용하는 구조입니다. 전기가 끊기면 물도 함께 끊겨 화장실조차 사용할 수 없습니다. 최근 들어 정전이 잦아졌는데, 하루는 무려 5시간 넘게 전기가 들어오지 않았습니다.\n\n더위도 더위지만 밥을 지을 수 없어 막막했습니다. 그런데 신기하게도, 그날따라 학교에서 돌아오는 길에 빵을 사 오고 싶은 마음이 들어 빵 몇 개를 사 두었던 것입니다. 촛불 하나 켜두고 온 가족이 둘러앉아 빵으로 저녁을 먹었습니다. 불평 한마디 없이 빵을 오물거리던 아이들이 예쁜 고백을 건넸습니다.\n\"엄마, 아빠! 오늘 저녁 굶지 않고 맛있는 빵을 먹을 수 있어서 감사해요. 그리고 날씨가 너무 덥지 않아서 다행이에요.\"\n아이들의 담담한 감사 앞에 부모의 마음이 오히려 부끄러워지고 코끝이 찡해졌습니다.\n\n건기가 시작되면서 매일 집 안으로 스며드는 화전 매연과 먼지로 목이 칼칼하고 눈이 따가웠습니다. 그런데 지난 편지를 읽으신 미국의 귀한 동역자님께서 공기청정기를 구입할 수 있도록 사랑을 보내주셨습니다. 광야에서 까마귀를 통해 엘리야를 먹이셨던 O나님의 섬세한 돌보심이 오늘도 저희 가정에 임하고 있음을 고백합니다. \n\n10월 초에는 교단 동역자이신 김종한 선생님 가정과 함께, 운영 중이신 'Cafe Flow'에 모여 은혜로운 ㅇ배를 드렸습니다. 함께 찬양하고 손잡고 ㄱ도하며 타국 땅에서 서로의 버팀목이 되어주는 따뜻한 위로와 힘을 얻었습니다."
