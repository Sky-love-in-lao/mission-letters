<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>11월 임시저장 불러오기</title>
</head>
<body>
  <p>작성된 11월 편지 초안을 불러오고 있습니다...</p>
  <script>
    fetch('draft_11.json').then(r => r.json()).then(data => {
      const id = data.id;
      const draftKey = 'missionletter.draft.' + id;
      
      const draft = {
        body: data.body,
        password: data.password,
        hint: data.hint,
        savedAt: new Date().toISOString()
      };
      
      localStorage.setItem(draftKey, JSON.stringify(draft));
      
      // Redirect to the write page
      window.location.replace('index.html#/write/' + id);
    });
  </script>
</body>
</html>
