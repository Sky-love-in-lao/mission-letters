<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>임시저장 불러오기</title>
</head>
<body>
  <script>
    const draft = {
      title: "9월 선교편지",
      period: "2026년 9월",
      greeting: "사랑하는 기도 동역자 여러분, 평안하신지요?",
      blocks: [
        {
          type: "text",
          value: "가을의 초입에서 9월의 소식을 전합니다.\n\n먼저 언어 공부 소식입니다. 현재 로뎀센터에서 월, 수, 금요일마다 라오스어를 열심히 배우고 있으며, 화요일과 목요일에는 집에서 라오스어 과외를 받으며 현지 언어에 적응하기 위해 최선을 다하고 있습니다.\n\n아이들은 지난 19일에 개학하여 학교에 잘 다니고 있습니다. 아이들도 학교에서 라오스어와 영어를 함께 배우며 씩씩하게 적응해 나가는 모습을 보니 참으로 감사한 마음입니다. 최근에는 아이들과 함께 현지 시장에 나가 직접 물건도 사보며 라오스의 삶 속으로 한 걸음 더 깊이 들어가는 시간을 가졌습니다.\n\n무엇보다 감사한 것은 저희 가정이 함께 드리는 가정예배입니다. 타지에서의 삶 속에서도 예배를 통해 주시는 은혜가 저희 가정을 든든히 붙들어 주고 있습니다.\n\n또한 최근에는 다가오는 전략회의 준비를 위해 라오스 선교부 회의를 은혜 가운데 잘 진행했습니다. 앞으로의 사역 방향을 잘 잡고 주님의 인도하심을 따를 수 있도록 기도 부탁드립니다."
        }
      ],
      closing: "변함없는 사랑과 기도로 함께해 주심에 진심으로 감사드립니다.",
      prayers: [
        { title: "언어 진보", text: "라오스어 학습에 지혜를 주시고 현지인들과의 소통에 어려움이 없도록" },
        { title: "가족과 자녀", text: "아이들이 학교 생활에 잘 적응하고, 가정예배를 통해 온 가족이 늘 성령 충만하도록" },
        { title: "선교부 사역", text: "전략회의 준비와 선교부의 모든 일정 가운데 하나님의 인도하심이 있도록" }
      ],
      savedAt: new Date().toISOString()
    };
    
    // 'new' (새 편지 작성) 용 임시저장 데이터 덮어쓰기
    localStorage.setItem('missionletter.draft.new', JSON.stringify(draft));
    
    // 작성 화면으로 이동
    window.location.replace('./?v=' + Date.now() + '#/write');
  </script>
  <p>작성 화면으로 이동 중입니다...</p>
</body>
</html>
